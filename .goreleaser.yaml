version: 2

project_name: sway-compat

builds:
  - id: sway-compat-linux
    main: .
    binary: sway-compat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cristianoliveira/sway-compat/cmd.version={{ .Version }}

archives:
  - id: linux
    ids:
      - sway-compat-linux
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - README.md
      - QUICKSTART.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  prerelease: auto

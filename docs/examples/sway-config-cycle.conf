# Example Sway configuration for window cycling
# Add this to your ~/.config/sway/config

# Window cycling (similar to macOS Cmd+`)
# Cycle forward through windows of the same application
bindsym $mod+grave exec sway-compat cycle-forward

# Cycle backward through windows of the same application
bindsym $mod+Shift+grave exec sway-compat cycle-backward

# Alternative: Use the simple 'cycle' command (defaults to forward)
# bindsym $mod+grave exec sway-compat cycle

# Note: Make sure sway-compat is in your PATH
# You can install it with: sudo cp sway-compat /usr/local/bin/
